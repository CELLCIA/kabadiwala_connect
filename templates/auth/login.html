{% extends "base.html" %}

{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-5">
        <div class="glass-card">
            <h3 class="text-center fw-bold mb-4">Welcome Back</h3>
            <form method="POST" action="{{ url_for('auth.login') }}">
                <div class="mb-3">
                    <label class="form-label">Email address</label>
                    <input type="email" class="form-control" name="email" required style="border-radius: 10px; border: 1px solid #ccc; padding: 10px;">
                </div>
                <div class="mb-4">
                    <label class="form-label">Password</label>
                    <input type="password" class="form-control" name="password" required style="border-radius: 10px; border: 1px solid #ccc; padding: 10px;">
                </div>
                <button type="submit" class="btn btn-glass-primary w-100">Login</button>
            </form>
            
            <hr class="my-4">
            
            <div class="text-center text-muted small">
                <p class="mb-1"><strong>Demo Accounts:</strong></p>
                <p class="mb-1">Collector: collector@example.com / Collector@123</p>
                <p class="mb-1">Recycler: recycler@example.com / Recycler@123</p>
                <p class="mb-0">Admin: admin@example.com / Admin@123</p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
