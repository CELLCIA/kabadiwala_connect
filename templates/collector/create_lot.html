{% extends "base.html" %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="glass-card">
            <h3 class="fw-bold mb-4 text-center">Sell Scrap</h3>
            
            <form method="POST" action="{{ url_for('collector.create_lot') }}" enctype="multipart/form-data">
                
                <!-- Step 1: Photo -->
                <div class="mb-4">
                    <h5><i class="bi bi-camera me-2 text-primary"></i>1. Photograph Scrap</h5>
                    <div class="p-4 text-center rounded" style="border: 2px dashed var(--secondary-color); background: rgba(255,255,255,0.3);">
                        <input type="file" id="photo" name="photo" accept="image/*" class="form-control mb-2" required>
                        <small class="text-muted">Take a clear picture of the e-waste</small>
                    </div>
                </div>

                <!-- Step 2: Material -->
                <div class="mb-4">
                    <h5><i class="bi bi-motherboard me-2 text-primary"></i>2. Select Material</h5>
                    <div class="row g-2">
                        {% for mat in materials %}
                        <div class="col-6 col-md-4">
                            <input type="radio" class="btn-check" name="material_id" id="mat_{{ mat.id }}" value="{{ mat.id }}" required>
                            <label class="btn btn-outline-success w-100 h-100 p-3" for="mat_{{ mat.id }}" style="border-radius:15px;">
                                <i class="bi bi-{{ mat.icon }} fs-3 d-block mb-2"></i>
                                <span class="fw-bold">{{ mat.name }}</span>
                            </label>
                        </div>
                        {% endfor %}
                    </div>
                </div>

                <!-- Step 3: Condition & Weight -->
                <div class="row mb-4">
                    <div class="col-md-6">
                        <h5><i class="bi bi-patch-check me-2 text-primary"></i>3. Condition</h5>
                        <select class="form-select" name="condition" style="border-radius:10px;">
                            <option value="Mixed">Mixed</option>
                            <option value="Good">Good</option>
                            <option value="Damaged">Damaged</option>
                            <option value="Unknown">Unknown</option>
                        </select>
                    </div>
                    <div class="col-md-6 mt-3 mt-md-0">
                        <h5><i class="bi bi-speedometer2 me-2 text-primary"></i>4. Weight</h5>
                        <div class="input-group">
                            <input type="number" step="0.1" min="0.1" class="form-control" name="weight" placeholder="e.g. 5.5" required style="border-radius:10px 0 0 10px;">
                            <span class="input-group-text bg-white" style="border-radius:0 10px 10px 0;">kg</span>
                        </div>
                    </div>
                </div>

                <div class="text-center mt-5">
                    <button type="submit" class="btn btn-glass-primary btn-lg w-100">Get Estimated Price & Find Recyclers</button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
